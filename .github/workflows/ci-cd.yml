name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    # Tests run against the PostgreSQL service below. DEBUG=True selects the
    # development-mode settings (console email, no production-only requirements).
    env:
      DEBUG: "True"
      POSTGRES_DB: test_maims
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_maims
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: maims-project/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd maims-project/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          cd maims-project/backend
          python manage.py check

      - name: Check for missing migrations
        run: |
          cd maims-project/backend
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: |
          cd maims-project/backend
          python manage.py test --noinput

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build
